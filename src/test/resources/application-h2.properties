spring.datasource.jobs.driver-class-name=${DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.datasource.jobs.url=jdbc:h2:mem:jobs;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.jobs.username=sa
spring.datasource.jobs.password=sa
spring.datasource.identity.driver-class-name=${DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.datasource.identity.url=jdbc:h2:mem:identity;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.identity.username=sa
spring.datasource.identity.password=sa
