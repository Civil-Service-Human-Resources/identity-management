spring:
  thymeleaf:
    cache: ${THYMELEAF_CACHE:true}
  datasource:
    url: ${DATASOURCE_URL:${database.host}/${database.name}?useSSL=${database.use-ssl}&requireSSL=false}
    username: ${DATASOURCE_USERNAME:root}
    password: ${DATASOURCE_PASSWORD:my-secret-pw}
    driver-class-name: com.mysql.cj.jdbc.Driver
  security:
    oauth2:
      resource:
        jwt:
          key-value: ${JWT_KEY:key}
      client:
        registration:
          identity-service:
            client-id: ${CLIENT_ID:management}
            client-secret: ${CLIENT_SECRET:test}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          identity-service:
            authorization-uri: ${identity.url}${identity.oauthAuthorizationEndpoint}
            token-uri: ${identity.url}${identity.oauthTokenEndpoint}

      refresh:
        service-token-cache:
          before-seconds-to-expire: ${REFRESH_SERVICETOKENCACHE_BEFORE_SECONDS_TOEXPIRE:0}

database:
  host: ${DATABASE_HOST:jdbc:mysql://localhost:3306}
  name: ${DATABASE_NAME:identity}
  use-ssl: ${DATABASE_USESSL:false}

server:
  port: 8081
  servlet:
    context-path: /mgmt

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  level:
    root: ${ROOT_LOGGING_LEVEL:DEBUG}
    uk.gov.cshr: ${CSHR_LOGGING_LEVEL:DEBUG}

identity:
  url: ${OAUTH_URL:http://localhost:8080}
  signoutUrl: ${identity.url}/logout
  idmLoginUrl: ${IDM_URL:http://localhost:8081}/mgmt
  oauthLogoutEndpoint: ${OAUTH_LOGOUT_ENDPOINT:/logout}
  oauthTokenEndpoint: ${OAUTH_TOKEN_ENDPOINT:/oauth2/token}
  oauthAuthorizationEndpoint: ${OAUTH_AUTHORIZATION_ENDPOINT:/oauth2/authorize}
  reset-uri: "/reset"
  reactivation-url: "/account/reactivate/%s"

learnerRecord:
  serviceUrl: ${LEARNER_RECORD_URL:http://localhost:9000}
  deleteUrl: "/learner/%s"

csrs:
  serviceUrl: ${REGISTRY_SERVICE_URL:http://localhost:9002}
  deleteUrl: "/civilServants/%s/delete"
  getCivilServant: "/civilServants/resource/%s"
  getAgencyToken: "/agencyTokens"
  updateOtherOrgUnitsUrl: "/civilServants/%s"

cslService:
  serviceUrl: ${CSL_SERVICE_URL:http://localhost:9003}
  getRequiredLearningUrl: "/api/learning/required/detailed"
  getFormattedOrganisationNames: "/api/organisations/formatted_list"
  getUserLearningUrl: "/api/learning"
  getDetailedLearningUrl: "/api/learning/detailed"

notifications:
  service: ${NOTIFICATION_SERVICE_URL:http://localhost:9006}
  email: "${notifications.service}/notifications/emails"
  bulkEmail: "${notifications.email}/bulk/send"
  bulkBatchSize: ${NOTIFICATION_SERVICE_BULK_BATCH_SIZE:20}

reporting:
  serviceUrl: ${REPORTING_SERVICE_URL:http://localhost:9004}
  registeredLearners:
    url: "/registered-learners"
    deactivateUrl: "${reporting.registeredLearners.url}/registered-learners/deactivate"
    deactivationBatchSize: ${REPORTING_DEACTIVATION_BATCH_SIZE:50}
  api:
    url: "/api/report"
    removeUserDataFromReportUrl: "${reporting.api.url}/remove-user-details"

accountPeriodsInMonths:
  deactivation: 13
  notification: 24
  deletion: 26

dataRetentionJob:
  cronSchedule: ${DATA_RETENTION_JOB_CRON_SCHEDULE:0 0 5 * * *}
  enabled: ${DATA_RETENTION_JOB_ENABLED:true}
  deactivationBatchSize: ${DR_DEACTIVATION_BATCH_SIZE:1000}

govNotify:
  templateName:
    accountSuspension: ${ACCOUNT_SUSPENSION_TEMPLATE_NAME:ACCOUNT_DEACTIVATED}
    accountDeletion: ${ACCOUNT_DELETION_TEMPLATE_NAME:ACCOUNT_DELETION_WARNING}
    accountDeleted: ${ACCOUNT_DELETED_TEMPLATE_NAME:ACCOUNT_DELETED}
    reactivation: ${REACTIVATION_TEMPLATE_NAME:ACCOUNT_REACTIVATED}

pagination:
  pageSize: ${PAGINATION_PAGE_SIZE:20}
