trigger:
  branches:
    include:
      - master
      - idt-develop
      - idt-feature-LC-*
      - idt-release-v*
      - idt-hotfix-v*
  tags:
    include:
      - '*'

variables:
  - name: acr_repo_suffix
    ${{ if startsWith(variables['Build.SourceBranch'], 'refs/tags') }}:
      value: 'prod'
    ${{ else }}:
      value: 'test'

name: '$(SourceBranchName)-$(Rev:r)'

pool:
  vmImage: ubuntu-latest

steps:
  - task: JavaToolInstaller@0
    inputs:
      versionSpec: '25'
      jdkArchitectureOption: 'x64'
      jdkSourceOption: 'PreInstalled'
    displayName: 'Install Java 25'

  - task: Maven@4
    inputs:
      mavenPOMFile: 'pom.xml'
      mavenVersionOption: 'Default'
      goals: 'clean package'
      javaHomeOption: 'Path'
      jdkDirectory: '$(JAVA_HOME_25_X64)'
      publishJUnitResults: false
      testResultsFiles: '**/surefire-reports/TEST-*.xml'
    displayName: 'Install Maven@4 and Java@8 and package'

  - task: Docker@2
    inputs:
      containerRegistry: 'lpgregistry ACR'
      repository: 'identity-management/${{ variables.acr_repo_suffix }}'
      command: 'buildAndPush'
      Dockerfile: '**/Dockerfile'
      tags: '$(Build.SourceBranchName)'
